[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-challenge-2026-entity-resolution"
version = "1.0.0"
description = "High-performance Multi-Source Business Entity Resolution pipeline achieving 0.9142 macro F0.5 in Amazon ML Challenge 2026."
authors = [
    { name = "Vishal Kumar", email = "rajvishalyadav7488@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.0.0",
    "rapidfuzz>=3.0.0",
    "anyascii>=0.3.0",
    "faiss-cpu>=1.7.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "venv",
    ".venv",
    "dataset",
    "output",
    "models",
    "scratch"
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | dataset
  | output
  | models
  | scratch
)/
'''
